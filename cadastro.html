<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro da Nostro Pizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <header class="cadastro">
        <menu>
            <nav>
                <a href="index.html">Início</a>
                <a href="login.html">Login</a>
                <a href="#" id="menuContato">Contato</a>
                <a href="#" id="menuSobre">Sobre</a>
            </nav>
        </menu>
    </header>
    <main>
         <form id="meuFormulario">
            <h1>Faça parte da Família: Cadastre-se!</h1>
               <!-- 1. campo Nome--> 
                <div class="cadastro">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Seu nome" required>
                </div><br>

               <!-- 2. campo E-mail--> 
                <div class="cadastro">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="nome@gmail.com" required>
                </div><br>

               <!-- 3. campo Senha--> 
                <div class="cadastro">
                    <label for="senha">Senha Secreta</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div><br>
               <!-- 4. campo CPF--> 
                <div class="cadastro">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div><br>
               <!-- 5. campo Endereço--> 
                <div class="cadastro">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" placeholder="Rua, Número, Bairro..." required>
                </div><br>
                <!--botão de cadastro-->
                <button type="submit" class="btn-cadastro">Cadastrar</button>
            </form>
    </main>
    <footer>
        
    </footer>
    <script src="script.js"></script>
</body>
</html>
